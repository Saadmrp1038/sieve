workload: create-update-recreate
actions:
- actionType: pauseController
  pauseAt: beforeControllerRead
  pauseScope: stringsecret/default/sieve-generated-secret
  avoidOngoingRead: true
  trigger:
    definitions:
    - triggerName: trigger1
      condition:
        conditionType: onObjectUpdate
        resourceKey: stringsecret/default/sieve-generated-secret
        prevStateDiff: '{"spec": {"data": {"marker": "initial"}}}'
        curStateDiff: '{"spec": {"data": {"marker": "updated"}}}'
        occurrence: 1
      observationPoint:
        when: beforeControllerRecv
        by: informer
    expression: trigger1
- actionType: resumeController
  pauseAt: beforeControllerRead
  pauseScope: stringsecret/default/sieve-generated-secret
  trigger:
    definitions:
    - triggerName: trigger2
      condition:
        conditionType: onAnyFieldModification
        resourceKey: stringsecret/default/sieve-generated-secret
        prevStateDiff: '{"spec": {"data": {"marker": "updated"}}}'
        occurrence: 1
      observationPoint:
        when: afterControllerRecv
        by: informer
    - triggerName: trigger3
      condition:
        conditionType: onObjectDelete
        resourceKey: stringsecret/default/sieve-generated-secret
        occurrence: 1
      observationPoint:
        when: afterControllerRecv
        by: informer
    expression: trigger2|trigger3
