apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-operator
  namespace: default
  labels:
    app.kubernetes.io/name: opentelemetry-operator
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-operator
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opentelemetry-operator
        control-plane: controller-manager
        sievetag: opentelemetry-operator
    spec:
      serviceAccountName: opentelemetry-operator-controller-manager
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: ${SIEVE-DR}/opentelemetry-operator:${SIEVE-DT}
        imagePullPolicy: IfNotPresent
        args:
        - --zap-log-level=info
        - --zap-time-encoding=rfc3339nano
        - --enable-webhooks=true
        - --enable-leader-election=true
        - --feature-gates=+operator.clusterobservability
        - --clusterobservability-collector-image=ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s:0.162.0
        - --target-allocator-image=ghcr.io/open-telemetry/opentelemetry-operator/target-allocator:0.162.0
        env:
        - name: SERVICE_ACCOUNT_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: sieveTestPlan
          valueFrom:
            configMapKeyRef:
              name: sieve-testing-global-config
              key: sieveTestPlan
        - name: KUBERNETES_SERVICE_HOST
          value: kind-control-plane
        - name: KUBERNETES_SERVICE_PORT
          value: '6443'
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: opentelemetry-operator-controller-manager-service-cert
