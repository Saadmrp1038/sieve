apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-rollouts
  namespace: default
  labels:
    app.kubernetes.io/component: rollouts-controller
    app.kubernetes.io/name: argo-rollouts
spec:
  replicas: 1
  selector:
    matchLabels:
      sievetag: argo-rollouts
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rollouts-controller
        app.kubernetes.io/name: argo-rollouts
        sievetag: argo-rollouts
    spec:
      serviceAccountName: argo-rollouts
      containers:
        - name: argo-rollouts
          image: ${SIEVE-DR}/argo-rollouts:${SIEVE-DT}
          imagePullPolicy: IfNotPresent
          args:
            - --rollout-threads=10
            - --service-threads=10
            - --experiment-threads=10
            - --analysis-threads=30
            - --ingress-threads=10
            - --loglevel=debug
            - --logformat=json
          env:
            - name: sieveTestPlan
              valueFrom:
                configMapKeyRef:
                  name: sieve-testing-global-config
                  key: sieveTestPlan
            - name: KUBERNETES_SERVICE_HOST
              value: kind-control-plane
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
          ports:
            - containerPort: 8090
              name: metrics
            - containerPort: 8080
              name: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: plugin-bin
              mountPath: /home/argo-rollouts/plugin-bin
            - name: tmp
              mountPath: /tmp
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: plugin-bin
          emptyDir: {}
        - name: tmp
          emptyDir: {}
