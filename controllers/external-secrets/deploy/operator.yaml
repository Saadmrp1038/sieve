apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-secrets
  namespace: default
  labels:
    helm.sh/chart: external-secrets-2.14.0
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: external-secrets
    app.kubernetes.io/version: v2.14.0
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      app.kubernetes.io/instance: external-secrets
  template:
    metadata:
      labels:
        helm.sh/chart: external-secrets-2.14.0
        app.kubernetes.io/name: external-secrets
        app.kubernetes.io/instance: external-secrets
        app.kubernetes.io/version: v2.14.0
        app.kubernetes.io/managed-by: Helm
        sievetag: external-secrets
    spec:
      serviceAccountName: external-secrets
      automountServiceAccountToken: true
      hostNetwork: false
      containers:
      - name: external-secrets
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        image: ${SIEVE-DR}/external-secrets:${SIEVE-DT}
        imagePullPolicy: IfNotPresent
        args:
        - --concurrent=1
        - --metrics-addr=:8080
        - --loglevel=info
        - --zap-time-encoding=epoch
        ports:
        - containerPort: 8080
          protocol: TCP
          name: metrics
        env:
        - name: sieveTestPlan
          valueFrom:
            configMapKeyRef:
              key: sieveTestPlan
              name: sieve-testing-global-config
        - name: KUBERNETES_SERVICE_HOST
          value: kind-control-plane
        - name: KUBERNETES_SERVICE_PORT
          value: '6443'
      dnsPolicy: ClusterFirst
