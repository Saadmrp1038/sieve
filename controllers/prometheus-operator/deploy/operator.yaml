apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: prometheus-operator
    app.kubernetes.io/version: 0.94.2
  name: prometheus-operator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: prometheus-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: prometheus-operator
        app.kubernetes.io/version: 0.94.2
        sievetag: prometheus-operator
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - --namespaces=default
        - --prometheus-config-reloader=quay.io/prometheus-operator/prometheus-config-reloader@sha256:a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71
        - --watch-referenced-objects-in-all-namespaces=false
        - --disable-unmanaged-prometheus-configuration=true
        - --kubelet-endpoints=false
        - --kubelet-endpointslice=false
        - --log-level=debug
        env:
        - name: GOGC
          value: "30"
        - name: sieveTestPlan
          valueFrom:
            configMapKeyRef:
              key: sieveTestPlan
              name: sieve-testing-global-config
        - name: KUBERNETES_SERVICE_HOST
          value: kind-control-plane
        - name: KUBERNETES_SERVICE_PORT
          value: "6443"
        image: ${SIEVE-DR}/prometheus-operator:${SIEVE-DT}
        imagePullPolicy: IfNotPresent
        name: prometheus-operator
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: 300m
            memory: 300Mi
          requests:
            cpu: 100m
            memory: 100Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: prometheus-operator
