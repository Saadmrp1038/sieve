# Generated by `uv run sieve ci generate`.
name: Oracle Generation
'on':
  workflow_dispatch: null
env:
  IMAGE_NAMESPACE: ghcr.io/sieve-project/action
jobs:
  cassandra-operator:
    runs-on: self-hosted
    env:
      GOPATH: /home/runner/go
      KUBECONFIG: /home/runner/.kube/config
    steps:
    - uses: actions/checkout@v6
    - name: Setup Go environment
      uses: actions/setup-go@v6
      with:
        go-version: 1.19.13
        cache-dependency-path: '**/go.sum'
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Setup GitHub Package Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
    - name: Install locked Python environment
      run: uv sync --locked --no-dev
    - name: Install Kind
      run: 'GO111MODULE="on" go install sigs.k8s.io/kind@v0.13.0

        kind'
    - name: Install Helm
      run: 'wget https://get.helm.sh/helm-v3.6.0-linux-amd64.tar.gz

        tar -zxvf helm-v3.6.0-linux-amd64.tar.gz

        sudo mv linux-amd64/helm /usr/local/bin/helm

        helm'
    - name: Sieve CI config generate
      run: 'mkdir -p configs

        printf ''%s\n'' ''{"workload_conditional_wait_timeout": 1000}'' > configs/local.json'
    - name: Sieve Learn - cassandra-operator recreate
      run: uv run --locked --no-dev sieve learn -c cassandra-operator -w recreate --build-oracle -r $IMAGE_NAMESPACE
    - name: Sieve Learn - cassandra-operator scaledown-scaleup
      run: uv run --locked --no-dev sieve learn -c cassandra-operator -w scaledown-scaleup --build-oracle -r $IMAGE_NAMESPACE
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sieve-cassandra-operator-log
        path: runs
    - name: Remove cluster
      if: always()
      run: kind delete cluster
    - uses: JamesIves/github-pages-deploy-action@4.1.5
      name: Persistent oracle data
      with:
        branch: oracle-data
        folder: runs/oracles/cassandra-operator
        target-folder: cassandra-operator/oracle
    - name: Clean images
      if: always()
      run: docker image prune -a -f && docker builder prune -a -f && docker system df
