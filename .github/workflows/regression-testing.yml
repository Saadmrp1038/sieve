# Generated by `uv run sieve ci generate`.
name: Regression Testing
'on':
  pull_request: null
  workflow_dispatch: null
env:
  IMAGE_NAMESPACE: ghcr.io/sieve-project/action
jobs:
  cassandra-operator:
    runs-on: ubuntu-22.04
    env:
      GOPATH: /home/runner/go
      KUBECONFIG: /home/runner/.kube/config
      EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - name: Setup Go environment
      uses: actions/setup-go@v6
      with:
        go-version-file: go.work
        cache-dependency-path: '**/go.sum'
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Setup GitHub Package Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
    - name: Install locked Python environment
      run: uv sync --locked --no-dev
    - name: Verify tested revision
      run: uv run --locked --no-dev sieve ci verify-revision --expected "$EXPECTED_REVISION"
    - name: Install Kind
      run: 'GO111MODULE="on" go install sigs.k8s.io/kind@v0.33.0

        kind'
    - name: Install Helm
      run: 'wget https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz

        tar -zxvf helm-v4.3.1-linux-amd64.tar.gz

        sudo mv linux-amd64/helm /usr/local/bin/helm

        helm'
    - name: Sieve CI config generate
      run: 'mkdir -p configs

        printf ''%s\n'' ''{"workload_conditional_wait_timeout": 1000}'' > configs/local.json'
    - name: Build Image - learn
      run: uv run --locked --no-dev sieve build -c cassandra-operator -m learn -r $IMAGE_NAMESPACE
    - name: Build Image - test
      run: uv run --locked --no-dev sieve build -c cassandra-operator -m test -r $IMAGE_NAMESPACE
    - name: Build Image - vanilla
      run: uv run --locked --no-dev sieve build -c cassandra-operator -m vanilla -r $IMAGE_NAMESPACE
