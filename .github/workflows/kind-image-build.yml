name: Kind Image Build
on:
  workflow_dispatch:
    inputs:
      platform-os:
        description: 'The platform to build the image on'
        default: 'ubuntu-latest'
        required: false
        type: choice
        options:
          - 'ubuntu-latest'
          - 'macos-latest'
  # schedule:
  #   - cron: '0 5 * * *'
permissions:
  contents: read
  packages: write
env:
  IMAGE_NAMESPACE: ghcr.io/saadmrp1038/sieve
jobs:
  build:
    runs-on: ${{ inputs.platform-os }}

    steps:
      - name: Set up environment variables
        run: |
             if [ "$RUNNER_OS" == "Linux" ]; then
               echo "GOPATH=/home/runner/go" >> "$GITHUB_ENV"
             else
               echo "GOPATH=/Users/runner/go" >> "$GITHUB_ENV"
             fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Setup docker (missing in macOS)
        if: runner.os == 'macos'
        uses: docker-practice/actions-setup-docker@master
        timeout-minutes: 12
      - name: Install missing tools in macOS
        if: runner.os == 'macos'
        run: |
              brew install bash kind
              `brew --prefix bash`/bin/bash # building k8s in macOS needs newer bash version
      - name: Setup GitHub Package Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Install locked Python environment
        run: uv sync --locked --no-dev
      - name: Build Image for v1.18
        run: |
          uv run --locked --no-dev sieve build -m vanilla --push -r $IMAGE_NAMESPACE
          uv run --locked --no-dev sieve build -m learn --push -r $IMAGE_NAMESPACE
          uv run --locked --no-dev sieve build -m test --push -r $IMAGE_NAMESPACE
      # - name: Build Image for v1.23
      #   run: |
      #     uv run --locked --no-dev sieve build --kubernetes-version v1.23.16 -m vanilla --push -r $IMAGE_NAMESPACE
      #     uv run --locked --no-dev sieve build --kubernetes-version v1.23.16 -m learn --push -r $IMAGE_NAMESPACE
      #     uv run --locked --no-dev sieve build --kubernetes-version v1.23.16 -m test --push -r $IMAGE_NAMESPACE
      - name: Build Image for v1.24
        run: |
          uv run --locked --no-dev sieve build --kubernetes-version v1.24.10 -m vanilla --push -r $IMAGE_NAMESPACE
          uv run --locked --no-dev sieve build --kubernetes-version v1.24.10 -m learn --push -r $IMAGE_NAMESPACE
          uv run --locked --no-dev sieve build --kubernetes-version v1.24.10 -m test --push -r $IMAGE_NAMESPACE
