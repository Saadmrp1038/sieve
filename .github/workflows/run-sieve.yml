name: Run Sieve against a controller

on:
  workflow_call:
    inputs:
      controller-name:
        description: Name of the controller integration
        required: true
        type: string
      github-repo:
        description: Repository containing the integration
        required: true
        type: string
      github-ref:
        description: Integration revision
        default: main
        type: string
      subdirectory:
        description: Directory containing config.json, build/, deploy/, and workloads/
        required: true
        type: string
      workload_name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-sieve:
    runs-on: ubuntu-22.04
    env:
      KUBECONFIG: /home/runner/.kube/config
      CONTROLLER: ${{ inputs.controller-name }}
      WORKLOAD: ${{ inputs.workload_name }}
      INTEGRATION_DIR: ${{ inputs.subdirectory }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Saadmrp1038/sieve
          ref: main
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.github-repo }}
          ref: ${{ inputs.github-ref }}
          path: .cache/integration
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: go/*/go.sum
      - name: Install tools
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          go install github.com/magefile/mage@v1.17.2
          curl -fsSL https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Install locked Python environment
        run: uv sync --locked --no-dev
      - name: Check environment
        run: uv run --locked --no-dev sieve doctor
      - name: Configure integration
        run: |
          mkdir -p configs
          printf '%s\n' '{"workload_command_wait_timeout": 1500}' > configs/local.json
          test -n "$CONTROLLER" && [[ "$CONTROLLER" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]
          rm -rf "controllers/$CONTROLLER"
          cp -R ".cache/integration/$INTEGRATION_DIR" "controllers/$CONTROLLER"
      - name: Build learning image
        run: uv run --locked --no-dev sieve build -c "$CONTROLLER" -m learn
      - name: Learn baseline and plans
        run: uv run --locked --no-dev sieve learn -c "$CONTROLLER" -w "$WORKLOAD" --output runs/ci/learn
      - name: Build testing image
        run: uv run --locked --no-dev sieve build -c "$CONTROLLER" -m test
      - name: Run plans
        run: |
          for pattern in intermediate-state unobserved-state stale-state; do
            plans="runs/ci/learn/$CONTROLLER/$WORKLOAD/learn/$pattern"
            if [ -d "$plans" ] && compgen -G "$plans/*.yaml" > /dev/null; then
              uv run --locked --no-dev sieve test -c "$CONTROLLER" -p "$plans" --batch --output "runs/ci/test/$pattern"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sieve-results
          path: runs/
      - name: Remove cluster
        if: always()
        run: kind delete cluster
