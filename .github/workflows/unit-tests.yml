name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-go@v6
        with:
          go-version: "1.19.13"
          cache-dependency-path: |
            go/client/go.sum
            go/instrumenter/go.sum
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Python regressions
        run: uv run --locked pytest
      - name: Client race checks
        working-directory: go/client
        run: go test -race ./...
      - name: Instrumentation checks
        working-directory: go/instrumenter
        run: go test ./...
      - name: Coordinator checks
        working-directory: go/coordinator
        run: go test ./...
      - name: Build package
        run: uv build --wheel
