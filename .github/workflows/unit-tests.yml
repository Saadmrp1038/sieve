name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go/coordinator/go.sum
            go/instrumenter/go.sum
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Check typed plan and configuration boundaries
        run: uv run --locked mypy
      - name: Python regressions
        run: uv run --locked pytest
      - name: Client race checks
        working-directory: go/client
        run: GOWORK=off go test -race ./...
      - name: Instrumentation checks
        working-directory: go/instrumenter
        run: GOWORK=off go test -race ./...
      - name: Coordinator checks
        working-directory: go/coordinator
        run: GOWORK=off go test -race ./...
      - name: Vet Go packages
        run: |
          for module in client coordinator instrumenter; do
            (cd "go/$module" && GOWORK=off go vet ./...)
          done
      - name: Build package
        run: uv build --wheel
      - name: Audit locked Python environment
        run: uv run --locked pip-audit --local --skip-editable
      - name: Check injected client dependency boundary
        run: test "$(GOWORK=off go -C go/client list -m all)" = sieve.client
      - name: Install Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Audit Go packages
        run: |
          for module in client coordinator instrumenter; do
            (cd "go/$module" && GOWORK=off govulncheck ./...)
          done
