name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.19.13"
          cache-dependency-path: |
            sieve_client/go.sum
            sieve_instrumentation/go.sum
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python regressions
        run: python -m unittest discover -s tests -v
      - name: Client race checks
        working-directory: sieve_client
        run: go test -race ./...
      - name: Instrumentation checks
        working-directory: sieve_instrumentation
        run: go test ./...
