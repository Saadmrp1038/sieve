[project]
name = "sieve-controller-testing"
version = "0.1.0"
description = "Reliability testing for Kubernetes controllers and operators"
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-2-Clause"
dependencies = [
    "kubernetes>=37.0.1,<38",
    "docker>=7.2.0,<8",
    "PyYAML>=6.0.3,<7",
    "deepdiff>=9.1.0,<10",
    "pydantic>=2.14.1,<3",
]

[project.scripts]
sieve = "sieve_tool.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sieve_tool"]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pip-audit==2.10.1",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.2,<1",
    "types-pyyaml>=6,<7",
]

[tool.uv]
required-version = "==0.13.5"
# Sieve's Docker/kind orchestration supports Linux and macOS, not Windows.
constraint-dependencies = ["requests>=2.34.2,<3", "urllib3>=2.8.0,<3"]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [
    ".cache",
    "experiments",
    "runs",
]

[tool.ruff.lint]
select = ["E9", "F", "B", "I"]

[tool.mypy]
files = [
    "src/sieve_tool/plans.py",
    "src/sieve_tool/common/config.py",
    "src/sieve_tool/paths.py",
    "src/sieve_tool/events.py",
    "src/sieve_tool/trace.py",
    "src/sieve_tool/analysis",
    "src/sieve_tool/faults",
    "src/sieve_tool/oracle",
    "src/sieve_tool/results.py",
    "src/sieve_tool/revisions.py",
    "src/sieve_tool/acceptance",
    "src/sieve_tool/testing/child_repair.py",
    "src/sieve_tool/testing/updates.py",
]
strict = true
follow_imports = "silent"
plugins = ["pydantic.mypy"]
