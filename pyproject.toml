[project]
name = "sieve-controller-testing"
version = "0.1.0"
description = "Reliability testing for Kubernetes controllers and operators"
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-2-Clause"
dependencies = [
    "kubernetes>=37.0.1,<38",
    "docker>=7.2.0,<8",
    "PyYAML>=6.0.3,<7",
    "deepdiff>=9.1.0,<10",
]

[project.scripts]
sieve = "sieve_tool.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sieve_tool"]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.2,<1",
]

[tool.uv]
required-version = "==0.13.5"
# Sieve's Docker/kind orchestration supports Linux and macOS, not Windows.
constraint-dependencies = ["requests>=2.34.2,<3", "urllib3>=2.8.0,<3"]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [
    ".cache",
    "experiments",
    "runs",
]

[tool.ruff.lint]
# Start with syntax and definite correctness errors in the legacy code.
select = ["E9", "F63", "F7", "F82"]
